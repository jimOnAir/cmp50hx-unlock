# Product packaging (map 90hx-gen2-610 ticket 06). Sibling of the cmp50hx
# DKMS module. AUTOINSTALL=yes keeps it alive across kernel updates; it is
# modprobe-blacklisted (deb/blacklist-gpu-unlock-claim.conf) so nothing loads
# it implicitly — only /usr/local/sbin/cmp90hx-claim.sh insmods it, once per
# boot, before the nvidia bind. The T09 table is selected in Kbuild
# (ccflags-y += -DGU_CMP90HX_T09); smoke-test asserts the 6-entry symbol size.
PACKAGE_NAME="gpu-unlock-claim"
PACKAGE_VERSION="610.43.03"
BUILT_MODULE_NAME[0]="gpu_unlock"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Build for each kernel instead of letting RHEL's weak-modules link one
# kernel's build into the others: removing the package then leaves links
# behind that break dracut for those kernels.
NO_WEAK_MODULES="yes"
BUILD_EXCLUSIVE_CONFIG="CONFIG_PCI CONFIG_FW_LOADER"
MAKE[0]="make KDIR=${kernel_source_dir}"
