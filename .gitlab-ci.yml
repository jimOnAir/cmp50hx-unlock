# GitLab CI — mirrors .github/workflows/release.yml.
#
# Produces the one-click Linux artifact on tag pipelines:
#   - cmp50hx-unlock_<ver>_amd64.deb (self-contained: NVIDIA 610.43.03
#     userland + patched DKMS modules + UEFI ESP unlock + services)
# and publishes it as a GitLab Release. The release is gated on the
# Ubuntu 26.04 install smoke below (test:linux-2604-install).
#
# Runner requirements: ordinary Linux docker runners only. On tag
# pipelines the binaries are uploaded to the project's Generic Package
# Registry (permanent URLs) and linked from a Release — see the release
# job.

stages: [build, package, release]

workflow:
  rules:
    # release publishing happens on tags; build+package also run on the
    # default branch so MRs and main stay verified
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  DEBIAN_FRONTEND: noninteractive

# -------------------------------------------------------------------
# build: EFI binary (same recipe as the GitHub linux job)
# -------------------------------------------------------------------
build:linux-efi:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential gnu-efi
  script:
    - cd efi-unlock
    - bash ./build.sh
    - sha256sum 50HXUNLK.EFI | tee 50HXUNLK.EFI.sha256
  artifacts:
    paths:
      - efi-unlock/50HXUNLK.EFI
      - efi-unlock/50HXUNLK.EFI.sha256
    expire_in: 1 week

# -------------------------------------------------------------------
# package: assemble the self-contained .deb (with smoke test)
# -------------------------------------------------------------------
package:linux:
  stage: package
  image: ubuntu:24.04
  needs: [build:linux-efi]
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential dpkg-dev curl patch kmod binutils ca-certificates
  script:
    - |
      set -eux
      CMP_DEB_REV="${CI_COMMIT_TAG:-dev}" bash tools/build-deb.sh --out .
    # smoke test: package contract (shared with the GitHub workflow)
    - |
      set -eux
      DEB="$(ls cmp50hx-unlock_*_amd64.deb)"
      bash tools/smoke-test-deb.sh "${DEB}"
  artifacts:
    paths:
      - cmp50hx-unlock_*_amd64.deb
      - cmp50hx-unlock_*_amd64.deb.sha256
    expire_in: 1 week

# -------------------------------------------------------------------
# package: Ubuntu 26.04 install smoke — installs the published .deb
# (built on 24.04) inside ubuntu:26.04: dependency resolution, postinst
# configure and the DKMS build against 26.04 kernel headers must pass,
# and removal must take the driver back out. Mirrors the GitHub job
# linux-2604-install.
# -------------------------------------------------------------------
test:linux-2604-install:
  stage: package
  image: ubuntu:26.04
  needs: [package:linux]
  script:
    - |
      set -eux
      apt-get update -qq
      apt-get install -y --no-install-recommends dpkg-dev
      DEB="$(pwd)/$(ls cmp50hx-unlock_*_amd64.deb)"
      bash tools/smoke-test-deb.sh "${DEB}"
      apt-get install -y "${DEB}"
      dpkg-query -s cmp50hx-unlock | grep -qx 'Status: install ok installed'
      dkms status | grep -q '^cmp50hx/.*: installed'
      krel=""
      for k in $(ls /usr/src | sed -n 's/^linux-headers-//p'); do
          [[ -d "/lib/modules/${k}/build" ]] && krel="${k}" && break
      done
      test -n "${krel}"
      modinfo -k "${krel}" nvidia | grep -q 'updates/dkms/nvidia'
      apt-get remove -y cmp50hx-unlock
      ! test -e /usr/bin/nvidia-smi
  after_script:
    - cat /var/log/cmp50hx-unlock-install.log 2>/dev/null || true

# -------------------------------------------------------------------
# release: upload artifacts to the Generic Package Registry (permanent
# URLs, independent of job artifact expiry) and create the Release
# -------------------------------------------------------------------
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [package:linux, test:linux-2604-install]
  script:
    - |
      set -eux
      PKG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}"
      DEB="$(ls cmp50hx-unlock_*_amd64.deb)"
      for f in "$DEB" "$DEB.sha256"; do
        curl --fail --show-error --retry 3 \
             --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" "${PKG_URL}/$f"
        echo "uploaded: $f"
      done
    - |
      DEB="$(ls cmp50hx-unlock_*_amd64.deb)"
      release-cli create \
        --name "CMP 50HX unlock ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "One-click installer for the CMP 50HX (TU102, 10de:1e09).

      Linux (Ubuntu 24.04 / 26.04, amd64) — download the .deb, then:
          sudo apt install ./${DEB}
      The package embeds the NVIDIA 610.43.03 driver (userland from the
      official .run), the patched open kernel modules as a DKMS tree
      (auto-rebuild on every kernel update), the UEFI ESP unlock, the
      cmp50hx-boot boot-flow service, the optional idle governor and cmp-tune.
      Remove with 'sudo apt remove cmp50hx-unlock' (uninstalls the driver).

      The package ships the UEFI compute unlock (FP32 31.7x / DP4A 28.4x over
      the locked stock driver, zero Xid; A/B matrix:
      efi-unlock/runs/20260910-ab-stock-vs-efi.md). Requires UEFI boot with
      Above 4G Decoding on. The DKMS kernel modules are not signed: disable
      Secure Boot or sign them with your own MOK." \
        --assets-link "{\"name\":\"${DEB}\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/${DEB}\"}" \
        --assets-link "{\"name\":\"${DEB}.sha256\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/${DEB}.sha256\"}"
