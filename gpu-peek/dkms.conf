# gpu-unlock-peek (map gtuu-mining ticket 10): the read-only diagnostic
# sibling of gpu-unlock-claim. AUTOINSTALL=yes keeps the .ko rebuilt across
# kernel updates ONLY — the module is modprobe-blacklisted
# (deb/blacklist-gpu-unlock-peek.conf) and has no alias, service, or unit:
# nothing in the boot flow may ever load it. /usr/local/sbin/cmp-peek
# insmods it on explicit operator demand, one card per invocation.
PACKAGE_NAME="gpu-unlock-peek"
PACKAGE_VERSION="610.43.03"
BUILT_MODULE_NAME[0]="gpu_peek"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Build for each kernel instead of letting RHEL's weak-modules link one
# kernel's build into the others: removing the package then leaves links
# behind that break dracut for those kernels.
NO_WEAK_MODULES="yes"
BUILD_EXCLUSIVE_CONFIG="CONFIG_PCI"
MAKE[0]="make KDIR=${kernel_source_dir}"
