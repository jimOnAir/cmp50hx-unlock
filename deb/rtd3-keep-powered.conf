# cmp50hx-unlock: D3cold (RTD3) insurance — SHIPPED COMMENTED ON PURPOSE.
#
# The whole unlock lives in volatile AON-backed state: a rail-off via
# runtime D3cold erases it silently (nv-uefi-unlocker docs/evidence/
# warm-resume-entry, corroborated by our t16 reset-scratch canary naming
# exactly this culprit class). Desktop-server slots rarely park; enabling
# this package-wide would change boot behavior on hosts that never asked
# for it — so the fleet default stays untouched and rigs/laptops opt in.
#
# To opt in, uncomment ONE line:
#options nvidia NVreg_DynamicPowerManagement=0x00
#
# Check current state per card (empty output = nothing parks):
#   for d in /sys/bus/pci/devices/*/; do [[ $(cat $d/vendor 2>/dev/null) == 0x10de ]] && echo "$(basename $d) $(cat $d/power/control 2>/dev/null)"; done
