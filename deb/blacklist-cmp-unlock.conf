# The claim window is package-owned. udev coldplug autoloads every module
# whose alias matches a CMP card — verified 2026-11-07 against the installed
# modules.alias: both `nvidia` and `nvidia_drm` carry the 10DE PCI-class
# aliases, so either could bind a card BEFORE the once-per-boot 90HX claim
# unit runs, silently collapsing its window (ADR-0001) and the boot-flow
# Gen2 gate. Block alias loading for the whole default set — including
# nvidia_uvm/nvidia_modeset, which have no aliases of their own but must
# never ride in early either.
#
# Blacklists are alias-scoped and do NOT block explicit loads: the boot
# flow's own loaders still work (the collect phase's setuid nvidia-modprobe
# and the post-claim phase 6 late module load, NVIDIA_MODULES_LATE). Keep
# it that way — re-enabling implicit loading for these modules breaks boot.
blacklist nouveau
blacklist nvidia
blacklist nvidia_uvm
blacklist nvidia_drm
blacklist nvidia_modeset
