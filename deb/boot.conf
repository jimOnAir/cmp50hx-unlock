# /etc/cmp50hx/boot.conf — policy for cmp50hx-boot.service (sourced as sh).
# Sane public defaults: nothing here reboots your machine or touches bench
# state. Edit and the next boot picks the change up (no daemon-reload needed).

# Bench evidence archival: append one ledger row per boot and copy the ESP
# unlocker logs under the bench debug dir (see cmp50hx/cmp50hx-collect.sh for
# the paths; they are bench-specific). 0 = off (default), 1 = on.
CMP_BOOT_COLLECT=0

# Optional: name of a cmp-tune profile (see /etc/cmp-tune.conf) to apply at
# the end of every boot. Empty = none. The apply happens after the Gen2
# phase, syncs the idle governor's drop-in, and never fails the boot.
CMP_BOOT_PROFILE=
