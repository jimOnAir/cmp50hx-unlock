# /etc/cmp50hx/boot.conf — policy for cmp50hx-boot.service (sourced as sh).
# Sane public defaults: nothing here reboots your machine or touches bench
# state. Edit and the next boot picks the change up (no daemon-reload needed).

# Bench evidence archival: append one ledger row per boot and copy the ESP
# unlocker logs under the bench debug dir (see cmp50hx/cmp50hx-collect.sh for
# the paths; they are bench-specific). 0 = off (default), 1 = on.
CMP_BOOT_COLLECT=0

# Optional: name of a cmp-tune profile (see /etc/cmp-tune.conf) to apply at
# the end of every boot. Empty = none. The apply happens after the Gen2
# phase, syncs the idle governor's drop-in, and never fails the boot.
CMP_BOOT_PROFILE=

# CMP 90HX PCIe Gen2 claim (cmp90hx-claim.service, map 90hx-gen2-610):
# once-per-boot privileged mask claim before the nvidia bind; the patched
# module then trains Gen2 at device init. enabled (default) | disabled.
# Disabling (or removing the unit) leaves the card at Gen1 — always safely.
GEN2_90HX=enabled

# Stock-equivalent late module load (boot-flow phase 6, map modules-late-610):
# after the claim window closes, the boot flow explicitly loads the module set
# a stock driver install ends with (nvidia, nvidia_uvm, nvidia-drm + its
# modeset dependency) so DRM consumers (LACT) see the GPUs. Best-effort: a
# failed load only logs a WARN and never affects the boot or serving.
# disabled = keep the card driver-only (no /dev/dri nodes at all).
# NOTE: never re-enable implicit (alias) loading for these modules — the
# claim unit requires the card to be UNBOUND when it runs; only the explicit
# post-claim load in phase 6 is allowed. See /etc/modprobe.d/cmp-unlock.conf.
NVIDIA_MODULES_LATE=enabled
