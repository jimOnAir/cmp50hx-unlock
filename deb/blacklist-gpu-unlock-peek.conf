blacklist gpu_peek
# The peek diagnostic (map gtuu-mining ticket 10) is loaded exclusively by
# /usr/local/sbin/cmp-peek through a direct insmod, on explicit operator
# demand. It is a PRE-driver sampler: bound-card numbers are meaningless, so
# nothing in the boot flow may ever pull it in. The DKMS AUTOINSTALL=yes in
# gpu-unlock-peek only keeps the .ko current across kernel updates.
